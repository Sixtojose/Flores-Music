name: Sincronizar mídias com Supabase

on:
  push:
    branches:
      - main
      - master
      - principal
    paths:
      - "musicas/**"
      - "videos/**"
      - "scripts/sync-media.mjs"
      - ".github/workflows/sync-media.yml"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enviar mídias para Supabase
        run: node scripts/sync-media.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
