const TABLE = "media";
const db = (window.supabase && SUPABASE_URL.startsWith("https://") &&
            !SUPABASE_URL.includes("COLE_AQUI") && !SUPABASE_ANON_KEY.includes("COLE_AQUI"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const audio = $("audioPlayer"), video = $("videoPlayer");
let records = [], tab = "all";
const DB_NAME = "flores-music-offline";
function openLocalDB(){return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>req.result.createObjectStore("files",{keyPath:"id"});
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
});}
let offlineCache = [];

async function savedFiles(){
  const d = await openLocalDB();

  return new Promise((res, rej) => {
    const r = d.transaction("files").objectStore("files").getAll();

    r.onsuccess = () => {
      offlineCache = r.result;
      res(offlineCache);
    };

    r.onerror = () => rej(r.error);
  });
}
async function saveOffline(item){
  try{
    const response=await fetch(item.url);if(!response.ok)throw Error("Não foi possível baixar o arquivo.");
    const blob=await response.blob();const d=await openLocalDB();
    await new Promise((res,rej)=>{const tx=d.transaction("files","readwrite");tx.objectStore("files").put({...item,blob});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
    render();$("status").textContent="Arquivo salvo para uso offline.";
  }catch(e){alert("Falha ao baixar: "+e.message);}
}
async function uploadSelectedFiles(){
  const input=$("mediaFiles"), button=$("uploadBtn"), status=$("uploadStatus");
  const files=Array.from(input.files||[]);
  if(!db){status.textContent="Supabase ainda não está configurado neste HTML. Preencha a URL e a chave pública.";return;}
  if(!files.length){status.textContent="Escolha pelo menos um arquivo primeiro.";return;}
  button.disabled=true;button.textContent="Enviando…";
  let sent=0;const errors=[];
  try{
    for(const file of files){
      const isAudio=file.type.startsWith("audio/");
      const isVideo=file.type.startsWith("video/");
      if(!isAudio&&!isVideo){errors.push(`${file.name}: formato não reconhecido.`);continue;}
      if(file.size===0){errors.push(`${file.name}: arquivo vazio.`);continue;}
      if(file.size>250*1024*1024){errors.push(`${file.name}: maior que 250 MB.`);continue;}
      status.textContent=`Enviando ${sent+1} de ${files.length}: ${file.name}`;
      const safeName=file.name.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=`${isAudio?"musicas":"videos"}/${Date.now()}-${crypto.randomUUID()}-${safeName}`;
      const {error:storageError}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
      if(storageError){errors.push(`${file.name}: falha no Storage — ${storageError.message}`);continue;}
      const title=file.name.replace(/\.[^.]+$/,"");
      const {error:dbError}=await db.from(TABLE).insert({title,type:isAudio?"audio":"video",storage_path:path});
      if(dbError){
        errors.push(`${file.name}: arquivo chegou ao Storage, mas não foi registrado na tabela — ${dbError.message}`);
        continue;
      }
      sent++;
    }
    await loadLibrary();
    status.textContent=`Concluído: ${sent} de ${files.length} arquivo(s) enviado(s).`+(errors.length?"\n\nProblemas:\n"+errors.join("\n"):"");
    if(sent===files.length)input.value="";
  }catch(e){status.textContent="Erro durante o envio: "+(e.message||e);}
  finally{button.disabled=false;button.textContent="Enviar para a biblioteca";}
}
function showSaved(){
  tab="saved";
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab==="saved"));
}
async function loadLibrary(){
  if(!db){
    $("status").textContent=navigator.onLine?"Não foi possível conectar à biblioteca online. Mostrando os arquivos baixados.":"Sem internet. Mostrando os arquivos baixados.";
    if(!records.length)showSaved();
    render();return;
  }
  $("status").textContent="Carregando biblioteca…";
  try{
    const {data,error}=await db.from(TABLE).select("*").order("created_at",{ascending:false});
    if(error)throw error;
    records=(data||[]).map(x=>({...x,url:db.storage.from(BUCKET).getPublicUrl(x.storage_path).data.publicUrl}));
    const activeCount=records.filter(x=>!x.deleted_at).length;
    const trashCount=records.filter(x=>!!x.deleted_at).length;
    $("status").textContent=`${activeCount} arquivo(s) na biblioteca · ${trashCount} na lixeira.`;
    render();
  }catch(e){$("status").textContent="Sem conexão com a biblioteca online — exibindo arquivos já baixados.";if(!records.length)showSaved();render();}
}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function render(){
  const offline=await savedFiles();
  let list=tab==="saved"?offline:records;
  if(tab==="trash")list=records.filter(x=>!!x.deleted_at);
  else if(tab==="all")list=records.filter(x=>!x.deleted_at);
  else if(tab==="audio")list=records.filter(x=>x.type==="audio"&&!x.deleted_at);
  else if(tab==="video")list=records.filter(x=>x.type==="video"&&!x.deleted_at);
  const q=$("search").value.toLowerCase().trim();
  list=list.filter(x=>(x.title||"").toLowerCase().includes(q));
  $("library").innerHTML=list.length?list.map(x=>{
    const isSaved=offline.some(y=>y.id===x.id);
    const inTrash=!!x.deleted_at;
    const normalActions=`<div class="actions"><button onclick="playItem('${String(x.id).replace(/'/g,"\\'")}')">▶ Tocar</button>${!isSaved&&x.url?`<button onclick="downloadItem('${String(x.id).replace(/'/g,"\\'")}')">↓ Offline</button>`:""}</div><div class="item-actions"><button class="danger" onclick="moveToTrash('${String(x.id).replace(/'/g,"\\'")}')">🗑️ Lixeira</button></div>`;
    const trashActions=`<div class="item-actions"><button class="restore" onclick="restoreItem('${String(x.id).replace(/'/g,"\\'")}')">↶ Restaurar</button><button class="danger" onclick="deletePermanently('${String(x.id).replace(/'/g,"\\'")}')">Excluir de vez</button></div>`;
    return `<article class="item">${x.cover_url?`<img class="cover" src="${escapeHTML(x.cover_url)}" alt="">`:`<div class="cover">${x.type==="video"?"▶":"♫"}</div>`}<div class="info"><strong>${escapeHTML(x.title)}</strong><small>${x.type==="video"?"Vídeo":"Música"} ${isSaved?"· Disponível offline":""} ${inTrash?"· Na lixeira":""}</small>${inTrash?trashActions:normalActions}</div></article>`;
  }).join(""):`<div class="empty">${tab==="trash"?"A lixeira está vazia.":"Nenhum arquivo nesta seção ainda."}</div>`;
}
async function moveToTrash(id){
  if(!db)return;
  const item=records.find(x=>String(x.id)===String(id));if(!item)return;
  if(!confirm(`Mover “${item.title}” para a lixeira?`))return;
  const {error}=await db.from(TABLE).update({deleted_at:new Date().toISOString()}).eq("id",id);
  if(error){alert("Não foi possível mover para a lixeira: "+error.message);return;}
  await loadLibrary();
}
async function restoreItem(id){
  if(!db)return;
  const {error}=await db.from(TABLE).update({deleted_at:null}).eq("id",id);
  if(error){alert("Não foi possível restaurar: "+error.message);return;}
  await loadLibrary();
}
async function deletePermanently(id){
  if(!db)return;
  const item=records.find(x=>String(x.id)===String(id));if(!item)return;
  if(!confirm(`Excluir DEFINITIVAMENTE “${item.title}”? O arquivo também será apagado do armazenamento e não poderá ser restaurado.`))return;
  const {error:storageError}=await db.storage.from(BUCKET).remove([item.storage_path]);
  if(storageError){alert("O arquivo não foi apagado do armazenamento: "+storageError.message);return;}
  const {error:rowError}=await db.from(TABLE).delete().eq("id",id);
  if(rowError){alert("O arquivo foi removido do armazenamento, mas o registro não foi apagado: "+rowError.message);return;}
  await loadLibrary();
}
async function playItem(id){
  const local=(await savedFiles()).find(x=>String(x.id)===String(id));
  const item=local||records.find(x=>String(x.id)===String(id));if(!item)return;
  const src=local?URL.createObjectURL(local.blob):item.url;
  $("nowTitle").textContent=item.title;$("nowSub").textContent=local?"Reprodução offline":"Flores Music";
  if(item.type==="video"){
    audio.pause();video.hidden=false;video.src=src;video.play().catch(()=>{});
    video.scrollIntoView({behavior:"smooth",block:"center"});
  }else{
    video.pause();video.hidden=true;video.removeAttribute("src");audio.src=src;audio.play().catch(()=>{});
  }
}
function downloadItem(id){const item=records.find(x=>String(x.id)===String(id));if(item)saveOffline(item);}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");tab=b.dataset.tab;render();
}));
$("search").addEventListener("input",render);$("sync").addEventListener("click",loadLibrary);
$("uploadBtn").addEventListener("click",uploadSelectedFiles);
function updateConnection(){$("connection").textContent=navigator.onLine?"Online":"Offline";}
window.addEventListener("online",()=>{updateConnection();loadLibrary();});
window.addEventListener("offline",updateConnection);
updateConnection();loadLibrary();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
</script>
</body>
</html>
